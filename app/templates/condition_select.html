{% extends "layout.html" %}

{% block content %}
<main class="researcher-shell">
  <section class="researcher-panel" aria-label="Researcher condition selection">
    <p class="eyebrow">Researcher Setup</p>
    <h1>Select Condition</h1>
    <p class="researcher-note">Choose one condition before handing the page to the participant.</p>

    <div class="condition-buttons">
      {% for condition, details in conditions %}
        <a href="{{ url_for('pages.select_condition', condition=condition) }}">
          <strong>{{ details.label }}</strong>
          <small>{{ details.description }}</small>
        </a>
      {% endfor %}
    </div>
  </section>
</main>
{% endblock %}
